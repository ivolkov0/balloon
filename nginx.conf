# /api проксируется на бэкенд по имени сервиса в docker-сети (см.
# docker-compose.yml) — браузер видит только один origin, поэтому CORS не
# нужен ни в деве (там та же роль у vite dev-proxy), ни в проде.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Аудио/картинки — можно кэшировать надолго, у сборки хэшированные имена
    # для JS/CSS, а статика в public/ меняется редко.
    location ~* \.(png|jpg|jpeg|svg|mp3|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
