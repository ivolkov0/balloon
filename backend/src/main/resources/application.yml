spring:
  datasource:
    url: jdbc:postgresql://[::1]:5432/vozshar
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  task:
    scheduling:
      pool:
        size: 8

server:
  # PaaS-платформы (Render и т.п.) назначают порт через $PORT и требуют,
  # чтобы приложение слушало именно его — иначе health-check не проходит и
  # деплой считается упавшим. Локально/в docker-compose $PORT не задан,
  # тогда остаётся привычный 8080.
  port: ${PORT:8080}